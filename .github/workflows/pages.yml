name: Build and deploy wiki site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Enforce public/private boundary
        run: python scripts/check_public_boundary.py

      - name: Install site builder
        run: python -m pip install --disable-pip-version-check "mkdocs==1.6.1"

      - name: Prepare generated site source
        run: |
          python scripts/prepare_site.py
          cp PRIVATE_OVERLAY.md .site-src/PRIVATE_OVERLAY.md

      - name: Generate project lenses and Wiki signals
        run: python scripts/generate_project_lenses.py

      - name: Build site
        run: mkdocs build --strict --site-dir _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
