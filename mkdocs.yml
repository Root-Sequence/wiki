site_name: Root Sequence Wiki
site_description: Living lexicon, project map, provenance record, and conceptual archaeology for the Root Sequence ecosystem.
site_url: https://wiki.rootsequence.systems/
repo_url: https://github.com/Root-Sequence/wiki
repo_name: Root-Sequence/wiki
edit_uri: edit/main/
docs_dir: .site-src
use_directory_urls: true

nav:
  - Home: index.md
  - Explore:
      - Entities: entities/index.md
      - Lexicon: lexicon.md
      - Phrases & Motifs: phrases.md
      - Seeds: seeds.md
  - Projects:
      - Project Index: projects.md
      - Project Lenses: lenses/index.md
      - Public Repository Registry: auto-projects.md
  - Knowledge Graph: graph.md
  - About:
      - Wiki Architecture: architecture.md
      - Public + Private Layers: PRIVATE_OVERLAY.md
      - Provenance: provenance.md
      - Concept Archaeology: archaeology.md
      - Wiki Signals: signals.md
      - Automation: automation.md
      - Publishing & Deployment: deployment.md
      - Entry Template: page-template.md
      - GitHub Repository: https://github.com/Root-Sequence/wiki

theme:
  name: mkdocs
  navigation_depth: 4

plugins:
  - search

markdown_extensions:
  - meta
  - tables
  - fenced_code
  - attr_list
  - toc:
      permalink: true

extra_css:
  - assets/wiki.css

extra_javascript:
  - assets/graph.js
